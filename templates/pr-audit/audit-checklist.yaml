## Audit Checklist

### 1. Scope Check

- [ ] PR scope matches approved task scope
- [ ] No files changed outside allowed file list
- [ ] No unrelated changes mixed in
- [ ] No forbidden files modified

**Notes:**

---

### 2. File Diff Check

- [ ] All file changes reviewed
- [ ] No generated files committed (build outputs, dependency folders)
- [ ] No `.env` or configuration secrets in diff
- [ ] File renames/deletions are intentional

**Notes:**

---

### 3. Test / Gate Check

- [ ] All required gates executed (not skipped without reason)
- [ ] Failed gates are recorded, not silently passed
- [ ] Self-review completed and documented
- [ ] Verification completed (if applicable)

**Notes:**

---

### 4. Runtime Verification

- [ ] Runtime smoke test completed and passed on working branch (or `Runtime Not Applicable` declared)
- [ ] Runtime evidence documented (screenshots, logs, terminal output, or HTTP responses) — or substitute evidence for N/A lanes
- [ ] Runtime evidence proves the app starts and the affected flows respond correctly — or substitute evidence confirms correctness
- [ ] Runtime status declared in audit verdict (`Runtime Verified`, `Runtime Not Verified`, or `Runtime Not Applicable`)

**Notes:**

If `Runtime Not Verified` is declared, the Pre-Merge Audit SHALL produce `DO_NOT_MERGE_REQUEST_CHANGES`.

If `Runtime Not Applicable` is declared, the canonical six-key N/A evidence contract is required (`runtime_status`, `runtime_reason`, `runtime_surface`, `runtime_evidence_or_substitute_evidence`, `runtime_verified_by`, `runtime_verified_at`). Substitute evidence may include `npm run validate`, `npm run dry-run`, `npm test`, `git diff --check`, cross-document contradiction analysis, or state-machine transition review.

---

### 5. Secret Scan

- [ ] No API keys, tokens, or credentials in diff
- [ ] No private keys or certificates
- [ ] No hardcoded passwords
- [ ] No provider-specific secret patterns

**Notes:**

---

### 6. Authority Drift Scan

- [ ] No agent certified its own work as final
- [ ] Merge-authorized only by owner (not by implementing agent)
- [ ] Audit chain preserved (implement → verify → audit → owner)
- [ ] No gate skipped without recorded reason

**Notes:**

---

### 7. Merge Recommendation

- [ ] `MERGE_OK` — PR is safe to merge as-is
- [ ] `MERGE_OK_OWNER_ACCEPTS_CAVEATS` — Owner must accept listed caveats
- [ ] `DO_NOT_MERGE_REQUEST_CHANGES` — Changes required before merge
- [ ] `DO_NOT_MERGE_BLOCKED` — Blocker must be resolved first

**Recommendation:**

**Caveats (if any):**

---

### Head SHA Integrity — Exact Evidence Binding

All SHAs MUST be full 40-character hexadecimal. Prefix matching is insufficient. Evidence from any other SHA is invalid.

**Binding Checklist:**

- [ ] 1. Proposed diff uses `audited_base_sha...audited_head_sha` (`git diff audited_base_sha...audited_head_sha`)
- [ ] 2. CI workflow head equals `audited_head_sha`
- [ ] 3. Every required status check identifies `audited_head_sha`
- [ ] 4. Runtime evidence identifies `audited_head_sha`
- [ ] 5. Runtime N/A substitute evidence identifies `audited_head_sha`
- [ ] 6. Codex audit result identifies `audited_head_sha`
- [ ] 7. Codex verdict identifies `audited_head_sha`
- [ ] 8. Comparison base equals `audited_base_sha`
- [ ] 9. Evidence from a different SHA is invalid for this audit
- [ ] 10. Base SHA change invalidates this checklist
- [ ] 11. Head SHA change invalidates this checklist
- [ ] 12. Material scope change invalidates this checklist
- [ ] 13. Invalidation requires fresh applicable runtime evidence, fresh checks, and a fresh audit

