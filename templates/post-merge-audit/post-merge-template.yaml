## Merge Verification

- [ ] Merge commit present in target branch history
- [ ] Merged diff matches approved PR scope
- [ ] No merge-resolution errors detected
- [ ] No cross-PR drift introduced

**Notes:**

---

## Main Branch Sync

- [ ] Target branch is up to date with main before merge
- [ ] No merge conflicts resolved incorrectly
- [ ] No orphaned files or directories

**Notes:**

---

## Post-Merge Gates

- [ ] Post-merge build/tests (if applicable) passing
- [ ] Documentation updated to reflect merged changes
- [ ] AgentBridge state files updated (if applicable)
- [ ] Task ledger reflects MERGED state

**Notes:**

---

## State / Doc Update Check

- [ ] AGENTS.md (or equivalent) reflects new state if needed
- [ ] Governance docs updated if governance changed
- [ ] No stale references to pre-merge state

**Notes:**

