name: PNPD CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show repository status
        run: git status --short --branch

      - name: Verify schemas and fixtures
        run: npm run validate

      - name: Run local dry-run
        run: npm run dry-run

      - name: Validate PNPD runtime readiness schema and fixtures
        run: node scripts/pnpd-validate-schemas.mjs --phase 1h

      - name: Validate PNPD runtime readiness stdout report
        run: |
          rm -rf .pnpd/runtime-readiness .pnpd/ledger .pnpd/handoffs .pnpd/locks

          node scripts/pnpd-orchestrator-dry-run.mjs --runtime-readiness > /tmp/pnpd-rr-stdout.json

          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/pnpd-rr-stdout.json','utf8')); if (r.schemaVersion !== '1.0.0') throw new Error('schemaVersion'); if (r.recordType !== 'pnpd.runtimeReadiness') throw new Error('recordType'); if (r.repo.path !== 'pnpd-os') throw new Error('repo.path'); if (r.source.remoteCiObserved !== false) throw new Error('remoteCiObserved'); if (r.dryRun.classification !== 'CODEX_REVIEW_REQUIRED') throw new Error('classification'); if (r.readiness.status !== 'reviewBlocked') throw new Error('readiness'); if (r.safety.advisoryOnly !== true) throw new Error('advisoryOnly'); if (r.safety.authorizesDispatch !== false) throw new Error('authorizesDispatch'); if (r.safety.authorizesDeployment !== false) throw new Error('authorizesDeployment'); if (r.safety.certifiesProductionReadiness !== false) throw new Error('certifiesProductionReadiness'); if (r.safety.mutatesGitHub !== false) throw new Error('mutatesGitHub'); if (r.authority.ownerFinalAuthority !== true) throw new Error('ownerFinalAuthority'); if (r.authority.codexAuditRequired !== true) throw new Error('codexAuditRequired'); if (!/^[a-f0-9]{64}$/.test(r.integrity.contentHash)) throw new Error('contentHash'); console.log('PASS: runtime readiness stdout report safe');"

          if [ -d .pnpd/runtime-readiness ]; then
            echo "::error::.pnpd/runtime-readiness should not be created by --runtime-readiness"
            exit 1
          fi

      - name: Validate PNPD runtime readiness local write mode
        run: |
          rm -rf .pnpd/runtime-readiness .pnpd/ledger .pnpd/handoffs .pnpd/locks

          node scripts/pnpd-orchestrator-dry-run.mjs --write-runtime-readiness > /tmp/pnpd-rr-write-stdout.json 2> /tmp/pnpd-rr-write-stderr.txt

          node -e "JSON.parse(require('fs').readFileSync('/tmp/pnpd-rr-write-stdout.json','utf8')); console.log('PASS: write stdout parses');"

          COUNT_WRITTEN="$(find .pnpd/runtime-readiness -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          if [ "$COUNT_WRITTEN" != "1" ]; then
            echo "::error::Expected exactly one runtime readiness report, found $COUNT_WRITTEN"
            find .pnpd/runtime-readiness -maxdepth 2 -print || true
            exit 1
          fi

          WRITTEN="$(find .pnpd/runtime-readiness -maxdepth 1 -type f -name '*.json' | head -n 1)"

          node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log('PASS: written report parses');" "$WRITTEN"

          cmp -s /tmp/pnpd-rr-write-stdout.json "$WRITTEN" || {
            echo "::error::Written runtime readiness report differs from stdout"
            exit 1
          }

          node -e "const fs=require('fs'); const path=require('path'); const file=process.argv[1]; const r=JSON.parse(fs.readFileSync(file,'utf8')); const base=path.basename(file); if (!/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{3}Z-[a-f0-9]{8}\.json$/.test(base)) throw new Error('filename'); if (!base.endsWith(r.integrity.contentHash.slice(0,8)+'.json')) throw new Error('hash prefix'); if (r.repo.path !== 'pnpd-os') throw new Error('repo.path'); if (r.source.remoteCiObserved !== false) throw new Error('remoteCiObserved'); for (const k of ['remoteCiProvider','remoteCiRunId','remoteCiStatus','remoteCiConclusion','remoteCiUrl']) { if (r.source[k] !== null) throw new Error(k); } if (r.dryRun.classification !== 'CODEX_REVIEW_REQUIRED') throw new Error('classification'); if (r.readiness.status !== 'reviewBlocked') throw new Error('readiness'); if (r.safety.advisoryOnly !== true) throw new Error('advisoryOnly'); if (r.safety.authorizesDispatch !== false) throw new Error('authorizesDispatch'); if (r.safety.authorizesDeployment !== false) throw new Error('authorizesDeployment'); if (r.safety.certifiesProductionReadiness !== false) throw new Error('certifiesProductionReadiness'); if (r.safety.mutatesGitHub !== false) throw new Error('mutatesGitHub'); if (r.authority.ownerFinalAuthority !== true) throw new Error('ownerFinalAuthority'); if (r.authority.codexAuditRequired !== true) throw new Error('codexAuditRequired'); if (!/^[a-f0-9]{64}$/.test(r.integrity.contentHash)) throw new Error('contentHash'); console.log('PASS: write-mode runtime readiness report safe');" "$WRITTEN"

      - name: Smoke PNPD runtime readiness incompatible flags
        run: |
          if node scripts/pnpd-orchestrator-dry-run.mjs --write-runtime-readiness --json 2>/dev/null; then
            echo "::error::--write-runtime-readiness --json should be rejected"
            exit 1
          fi

          if node scripts/pnpd-orchestrator-dry-run.mjs --write-runtime-readiness --no-write 2>/dev/null; then
            echo "::error::--write-runtime-readiness --no-write should be rejected"
            exit 1
          fi

          echo "PASS: incompatible runtime readiness flag smoke"

      - name: Clean PNPD generated state
        if: always()
        run: |
          rm -rf .pnpd/runtime-readiness .pnpd/ledger .pnpd/handoffs .pnpd/locks
          rm -f /tmp/pnpd-rr-stdout.json /tmp/pnpd-rr-write-stdout.json /tmp/pnpd-rr-write-stderr.txt

      - name: Verify no PNPD state directories
        if: always()
        run: |
          for dir in .pnpd/runtime-readiness .pnpd/ledger .pnpd/handoffs .pnpd/locks; do
            if [ -d "$dir" ]; then
              echo "::error::Unexpected PNPD state directory present: $dir"
              exit 1
            fi
          done

      - name: Verify clean working tree
        if: always()
        run: git diff --exit-code
